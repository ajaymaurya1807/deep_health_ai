<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0d5c75" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Deep Health AI" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="app-icon.png" />
    <link rel="stylesheet" href="app.css?v=17" />
    <link rel="stylesheet" href="nav.css?v=17" />
    <title>Deep Health AI</title>
  </head>
  <body>
    <main id="device" aria-label="Deep Health AI mobile prototype">
      <iframe id="screen" title="Deep Health AI" allow="camera; clipboard-write"></iframe>
      <nav id="app-nav" class="app-nav" aria-label="Primary navigation" hidden>
        <button data-route="home"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
        <button data-route="report"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 13h4l2.2-6 4.1 12 3-9 1.7 3h5"/></svg><span>Reports</span></button>
        <button data-route="position" class="scan-tab"><svg class="scan-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5M8 8h3v3H8zM14 8h2v2h-2zM8 14h2v2H8zM13 13h3v3h-3z"/></svg><span>Scan</span></button>
        <button data-route="plans"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8M9 2h6a1 1 0 0 1 1 1v3H8V3a1 1 0 0 1 1-1ZM6 5h12a2 2 0 0 1 2 2v14H4V7a2 2 0 0 1 2-2Zm2 6h8m-8 4h8"/></svg><span>Plans</span></button>
        <button data-route="profile"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="9" r="3"/><path d="M6.5 19c.8-3 2.6-4.5 5.5-4.5s4.7 1.5 5.5 4.5"/></svg><span>Profile</span></button>
      </nav>
      <div id="loading" class="loading"><span></span><p>Loading secure health experience…</p></div>
      <div id="scrim" class="scrim" hidden></div>
      <section id="sheet" class="sheet" hidden aria-modal="true" role="dialog"></section>
      <div id="toast" class="toast" role="status" hidden></div>
    </main>
    <script type="module" src="app.js?v=17"></script>
  </body>
</html>
