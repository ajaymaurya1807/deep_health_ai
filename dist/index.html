<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0d5c75" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Deep Health AI" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="app-icon.png" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="nav.css" />
    <title>Deep Health AI</title>
  </head>
  <body>
    <main id="device" aria-label="Deep Health AI mobile prototype">
      <iframe id="screen" title="Deep Health AI" allow="camera; clipboard-write"></iframe>
      <nav id="app-nav" class="app-nav" aria-label="Primary navigation" hidden>
        <button data-route="home"><span class="material-symbols-outlined nav-icon">home</span><span>Home</span></button>
        <button data-route="report"><span class="material-symbols-outlined nav-icon">vital_signs</span><span>Reports</span></button>
        <button data-route="position" class="scan-tab"><span class="material-symbols-outlined scan-icon">qr_code_scanner</span><span>Scan</span></button>
        <button data-route="plans"><span class="material-symbols-outlined nav-icon">assignment</span><span>Plans</span></button>
        <button data-route="profile"><span class="material-symbols-outlined nav-icon">account_circle</span><span>Profile</span></button>
      </nav>
      <div id="loading" class="loading"><span></span><p>Loading secure health experience…</p></div>
      <div id="scrim" class="scrim" hidden></div>
      <section id="sheet" class="sheet" hidden aria-modal="true" role="dialog"></section>
      <div id="toast" class="toast" role="status" hidden></div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
