        Resend OTP

<!-- Primary Verification CTA Button -->

<div class="grid grid-cols-3 gap-2">
<!-- 1 -->

<!-- 2 -->

</button>
<!-- 3 -->
<button class="keypad-btn h-12 rounded-lg bg-surface-container-low active:bg-surface-container-highest flex flex-col items-center justify-center transition-all duration-75 shadow-xs" data-val="3" type="button">

</button>
<!-- 4 -->
<button class="keypad-btn h-12 rounded-lg bg-surface-container-low active:bg-surface-container-highest flex flex-col items-center justify-center transition-all duration-75 shadow-xs" data-val="4" type="button">
<span class="font-headline-md text-headline-md text-on-surface leading-none font-semibold">4</span>
<span class="font-label-sm text-[9px] text-on-surface-variant opacity-60 tracking-widest uppercase">GHI</span>
</button>
<!-- 5 -->
<button class="keypad-btn h-12 rounded-lg bg-surface-container-low active:bg-surface-container-highest flex flex-col items-center justify-center transition-all duration-75 shadow-xs" data-val="5" type="button">
<span class="font-headline-md text-headline-md text-on-surface leading-none font-semibold">5</span>
<span class="font-label-sm text-[9px] text-on-surface-variant opacity-60 tracking-widest uppercase">JKL</span>
</button>
<!-- 6 -->
<button class="keypad-btn h-12 rounded-lg bg-surface-container-low active:bg-surface-container-highest flex flex-col items-center justify-center transition-all duration-75 shadow-xs" data-val="6" type="button">
<span class="font-headline-md text-headline-md text-on-surface leading-none font-semibold">6</span>

<!-- 7 -->

<span class="font-headline-md text-headline-md text-on-surface leading-none font-semibold">7</span>

</button>
<!-- 8 -->

<span class="material-symbols-outlined text-[24px]">fingerprint</span>
</button>
<!-- 0 -->

</button>
<!-- Backspace -->
<button aria-label="Delete last digit" class="h-12 rounded-lg bg-transparent active:bg-surface-container-high flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors" id="keypad-backspace" type="button">
<span class="material-symbols-outlined text-[22px]">backspace</span>
</button>
</div>
</div>
</div>
<script>
  (function () {
    let digits = ['8', '4', '2', '9'];
    const maxDigits = 6;
    const cells = document.querySelectorAll('.otp-cell');
    const countdownEl = document.getElementById('countdown-val');
    const resendBtn = document.getElementById('resend-btn');
    const bioBtn = document.getElementById('bio-quick-auth');
    const submitBtn = document.getElementById('verify-submit-btn');

    function updateOtpDisplay() {
      cells.forEach((cell, idx) => {
        const valSpan = cell.querySelector('span');
        const caret = cell.querySelector('.animate-pulse');
        const dot = cell.querySelector('.rounded-full:not(.animate-pulse)');
        const highlight = cell.querySelector('.absolute.inset-0');

        if (highlight) highlight.remove();
        if (caret) caret.remove();
        if (dot) dot.remove();

        if (idx < digits.length) {
          cell.className = 'otp-cell w-11 h-14 rounded-lg bg-surface-container-lowest flex items-center justify-center shadow-sm relative transition-all duration-150';
          valSpan.textContent = digits[idx];
          valSpan.classList.remove('hidden');
        } else if (idx === digits.length) {
          // Current Active Box
          cell.className = 'otp-cell w-11 h-14 rounded-lg bg-surface-container-lowest flex items-center justify-center shadow-md relative bg-surface-bright transition-all duration-150';
          valSpan.textContent = '';
          valSpan.classList.add('hidden');
          const halo = document.createElement('div');
          halo.className = 'absolute inset-0 rounded-lg bg-primary/10 pointer-events-none';
          cell.appendChild(halo);
          const cursor = document.createElement('div');
          cursor.className = 'w-0.5 h-6 bg-primary-container rounded-full animate-pulse';
          cell.appendChild(cursor);
        } else {
          // Remaining Inactive
          cell.className = 'otp-cell w-11 h-14 rounded-lg bg-surface-container-low flex items-center justify-center shadow-sm relative transition-all duration-150';
          valSpan.textContent = '';
          valSpan.classList.add('hidden');
          const placeholderDot = document.createElement('div');
          placeholderDot.className = 'w-1.5 h-1.5 rounded-full bg-outline-variant/60';
          cell.appendChild(placeholderDot);
        }
      });

      if (digits.length === maxDigits) {
        submitBtn.classList.remove('bg-primary-container');
        submitBtn.classList.add('bg-clinical-success');
      } else {
        submitBtn.classList.remove('bg-clinical-success');
        submitBtn.classList.add('bg-primary-container');
      }
    }

    document.querySelectorAll('.keypad-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.getAttribute('data-val');
        if (digits.length < maxDigits) {
          digits.push(val);
          updateOtpDisplay();
        }
      });
    });

    document.getElementById('keypad-backspace').addEventListener('click', () => {
      if (digits.length > 0) {
        digits.pop();
        updateOtpDisplay();
      }
    });

    if (bioBtn) {
      bioBtn.addEventListener('click', () => {
        digits = ['8', '4', '2', '9', '7', '1'];
        updateOtpDisplay();
      });
    }

    // Countdown Timer logic
    let timeLeft = 28;
    const interval = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) {
        clearInterval(interval);
        countdownEl.textContent = '00:00';
        resendBtn.disabled = false;
        resendBtn.classList.remove('text-outline', 'cursor-not-allowed', 'opacity-60');
        resendBtn.classList.add('text-primary', 'hover:underline', 'cursor-pointer');
      } else {
        const formatted = timeLeft < 10 ? '0' + timeLeft : timeLeft;
        countdownEl.textContent = '00:' + formatted;
      }
    }, 1000);

    resendBtn.addEventListener('click', () => {
      if (!resendBtn.disabled) {
        timeLeft = 30;
        resendBtn.disabled = true;
        resendBtn.classList.add('text-outline', 'cursor-not-allowed', 'opacity-60');
        resendBtn.classList.remove('text-primary', 'hover:underline', 'cursor-pointer');
        digits = [];
        updateOtpDisplay();
      }
    });
  })();
</script></main></body></html>
