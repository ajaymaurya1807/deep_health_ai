<script>
  function filterSettings(query) {
    const term = query.toLowerCase().trim();
    const groups = document.querySelectorAll('.settings-group');
    const clearBtn = document.getElementById('clearSearchBtn');
    const emptyState = document.getElementById('noResultsState');
    let totalVisible = 0;

    if (clearBtn) {
      if (term.length > 0) {
        clearBtn.classList.remove('opacity-0', 'pointer-events-none');
        clearBtn.classList.add('opacity-100');
      } else {
        clearBtn.classList.add('opacity-0', 'pointer-events-none');
        clearBtn.classList.remove('opacity-100');
      }
    }

    groups.forEach(group => {
      const groupKeywords = (group.getAttribute('data-group-name') || '').toLowerCase();
      const items = group.querySelectorAll('.settings-item');
      let groupHasMatch = false;

      items.forEach(item => {
        const itemKeywords = (item.getAttribute('data-keywords') || '').toLowerCase();
        const textContent = item.innerText.toLowerCase();

        if (!term || itemKeywords.includes(term) || textContent.includes(term) || groupKeywords.includes(term)) {
          item.style.display = 'flex';
          groupHasMatch = true;
          totalVisible++;
        } else {
          item.style.display = 'none';
        }
      });

      if (!term || groupHasMatch) {
        group.style.display = 'flex';
      } else {
        group.style.display = 'none';
      }
    });

    if (emptyState) {
      if (totalVisible === 0 && term.length > 0) {
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
      } else {
        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');
      }
    }
  }

  const searchInput = document.getElementById('settingsSearchInput');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      filterSettings(e.target.value);
    });
  }

  function confirmLogout() {
    if (confirm("Log out from Deep Health AI on this device? Your offline telemetry remains securely encrypted.")) {
      console.log("Logged out successfully");
    }
  }
